<!doctype html>
<html lang="en" data-theme="valheimlodge">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="shortcut icon" href="/favicon-57x57.png" type="image/png" />

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

		<!-- Android Icon -->
		<link rel="icon" sizes="192x192" href="/favicon-72x72.png" />
		<link rel="icon" sizes="72x72" href="/favicon-72x72.png" />

		<!-- MS Edge Icon -->
		<meta name="msapplication-TileImage" content="/apple-touch-icon-152x152.png" />
		<meta name="msapplication-TileColor" content="#003366" />

		<!-- Default OG/Social Meta Tags (can be overridden per page) -->
		<meta property="og:site_name" content="Valheim Lodge #364 - Sons of Norway" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:image" content="/apple-touch-icon-152x152.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:site" content="@SonsofNorway" />

		<!-- Theme Color -->
		<meta name="theme-color" content="#003366" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
